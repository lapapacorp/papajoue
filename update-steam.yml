name: Mise à jour des données Steam

on:
  push:
    paths: ['jeux.txt']
  schedule:
    - cron: '0 5 * * *'   # tous les jours à 5h UTC (prix à jour)
  workflow_dispatch:       # bouton "Run workflow" manuel

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-steam.mjs
      - name: Commit si changement
        run: |
          git config user.name "steam-bot"
          git config user.email "steam-bot@users.noreply.github.com"
          git add games.json
          git diff --staged --quiet || git commit -m "Mise à jour Steam" && git push
